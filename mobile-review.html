<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>当前渠道审核</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .phone-frame {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background: #f5f6f8;
      position: relative;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    /* ========== 顶部导航 ========== */
    .navbar {
      height: 88px;
      background: #fff;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 16px 14px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 0.5px solid #eee;
    }
    .navbar .nav-back {
      position: absolute;
      left: 16px;
      bottom: 14px;
      font-size: 24px;
      color: #333;
      cursor: pointer;
      width: 36px;
      text-align: center;
    }
    .navbar .nav-title {
      font-size: 16px;
      font-weight: 500;
      color: #1a1a1a;
    }

    /* ========== 区块标题 ========== */
    .block-title {
      display: flex;
      align-items: center;
      padding: 18px 16px 10px;
    }
    .block-title .bar {
      width: 3px;
      height: 14px;
      background: #4A9B8E;
      border-radius: 2px;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .block-title .text {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }

    /* ========== 卡片 ========== */
    .card {
      background: #fff;
      margin: 0 12px 12px;
      border-radius: 10px;
      overflow: hidden;
    }

    /* ========== 信息行 ========== */
    .info-row {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 0.5px solid #f2f2f2;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .label {
      flex: 1;
      font-size: 14px;
      color: #666;
    }
    .info-row .value {
      font-size: 14px;
      color: #1a1a1a;
      text-align: right;
      max-width: 50%;
      word-break: break-all;
    }

    /* ========== 当前渠道 平铺区 ========== */
    .channel-card {
      background: #fff;
      margin: 0 12px 12px;
      border-radius: 10px;
      overflow: hidden;
    }
    .channel-card .info-row {
      padding-bottom: 12px;
    }
    .channel-card .info-row .value {
      color: #1a1a1a;
      font-weight: 500;
    }

    .channel-divider {
      height: 1px;
      background: #f2f2f2;
      margin: 0 16px;
    }

    .channel-list {
      padding: 4px 0 8px;
    }
    .channel-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
    }
    .channel-item .c-num {
      width: 20px;
      font-size: 13px;
      color: #999;
      flex-shrink: 0;
    }
    .channel-item .c-name {
      font-size: 14px;
      color: #333;
    }

    /* ========== 截图区域 ========== */
    .screenshot-row {
      padding: 14px 16px;
    }
    .screenshot-row .label {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
    }
    .screenshot-placeholder {
      display: flex;
      gap: 8px;
    }
    .screenshot-thumb {
      width: 90px;
      height: 72px;
      background: #f5f5f5;
      border: 1px dashed #ddd;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #bbb;
    }

    /* ========== 底部占位 ========== */
    .spacer { height: 20px; }
  </style>
</head>
<body>

<div class="phone-frame">

  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="nav-back">‹</div>
    <div class="nav-title">曹县億柯凯瑞箱包店 dl10a1</div>
  </nav>

  <!-- 拓展商户行业 -->
  <div class="card">
    <div class="info-row">
      <div class="label">拓展商户行业</div>
      <div class="value">8888</div>
    </div>
  </div>

  <!-- 贵司存量数据 -->
  <div class="block-title"><div class="bar"></div><div class="text">贵司存量数据</div></div>
  <div class="card">
    <div class="info-row">
      <div class="label">日笔数 (万笔)</div>
      <div class="value">3</div>
    </div>
    <div class="info-row">
      <div class="label">日交易金额 (万元)</div>
      <div class="value">6</div>
    </div>
  </div>

  <!-- 签约我司后预估数据 -->
  <div class="block-title"><div class="bar"></div><div class="text">签约我司后预估数据</div></div>
  <div class="card">
    <div class="info-row">
      <div class="label">预计日交易笔数 (万笔)</div>
      <div class="value">1111</div>
    </div>
    <div class="info-row">
      <div class="label">完成预估规模时间</div>
      <div class="value">111</div>
    </div>
  </div>

  <!-- 展业模式 -->
  <div class="card">
    <div class="info-row">
      <div class="label">展业模式</div>
      <div class="value">直营</div>
    </div>
  </div>

  <!-- 当前渠道（平铺展开） -->
  <div class="channel-card">
    <div class="info-row">
      <div class="label">当前渠道</div>
      <div class="value">乐刷、富友、收钱吧</div>
    </div>
    <div class="channel-divider"></div>
    <div class="channel-list">
      <div class="channel-item"><span class="c-num">1.</span><span class="c-name">乐刷</span></div>
      <div class="channel-item"><span class="c-num">2.</span><span class="c-name">富友</span></div>
      <div class="channel-item"><span class="c-num">3.</span><span class="c-name">收钱吧</span></div>
    </div>
  </div>

  <!-- 业务场景模式 -->
  <div class="card">
    <div class="info-row">
      <div class="label">业务场景模式</div>
      <div class="value">线下</div>
    </div>
  </div>

  <!-- 公司规模 + 信用等级 + 业务介绍 -->
  <div class="card">
    <div class="info-row">
      <div class="label">公司规模 (人数)</div>
      <div class="value">999</div>
    </div>
    <div class="info-row">
      <div class="label">财务纳税信用等级</div>
      <div class="value">A</div>
    </div>
    <div class="info-row">
      <div class="label">产品及业务介绍</div>
      <div class="value">多大的</div>
    </div>
  </div>

  <!-- 截图 -->
  <div class="card">
    <div class="screenshot-row">
      <div class="label">财务纳税信用等级清算协会备案截图</div>
      <div class="screenshot-placeholder">
        <div class="screenshot-thumb">截图1</div>
        <div class="screenshot-thumb">截图2</div>
      </div>
    </div>
  </div>

  <div class="spacer"></div>

  <!-- 结算信息 -->
  <div class="block-title"><div class="bar"></div><div class="text">结算信息</div></div>
  <div class="card" style="margin-bottom: 20px;">
    <div class="info-row">
      <div class="label">结算方式</div>
      <div class="value">T+1</div>
    </div>
    <div class="info-row">
      <div class="label">结算银行卡号</div>
      <div class="value">6222 **** **** 1234</div>
    </div>
    <div class="info-row">
      <div class="label">开户行</div>
      <div class="value">中国工商银行</div>
    </div>
  </div>

</div>

</body>
</html>
