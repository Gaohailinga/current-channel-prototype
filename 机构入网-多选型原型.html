<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>机构入网 - 当前渠道多选改造</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #f0f2f5;
    color: #262626;
    padding-bottom: 80px;
  }

  /* ---------- 表单区域 ---------- */
  .form-wrap {
    max-width: 960px;
    margin: 20px auto;
    background: #fff;
    border-radius: 4px;
    padding: 24px 32px 32px;
  }

  .form-row {
    display: flex;
    align-items: flex-start;
    margin-bottom: 20px;
  }
  .form-label {
    width: 160px;
    flex: 0 0 160px;
    text-align: right;
    padding-right: 16px;
    font-size: 14px;
    line-height: 32px;
    color: #262626;
  }
  .form-label .req { color: #ff4d4f; margin-right: 4px; }
  .form-ctrl { flex: 1; }
  .form-ctrl .sub-label { font-size: 13px; color: #8c8c8c; margin-left: 4px; }

  /* ---------- 输入框 ---------- */
  .text-input {
    width: 360px;
    height: 32px;
    border: 1px solid #d9d9d9;
    border-radius: 2px;
    padding: 0 12px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    background: #fff;
  }
  .text-input::placeholder { color: #bfbfbf; }
  .text-input:focus { border-color: #1890ff; }

  .text-input-wide {
    width: 100%;
    max-width: 700px;
  }
  .textarea-input {
    width: 100%;
    max-width: 700px;
    height: 80px;
    border: 1px solid #d9d9d9;
    border-radius: 2px;
    padding: 8px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    resize: vertical;
    transition: border-color .2s;
  }
  .textarea-input::placeholder { color: #bfbfbf; }
  .textarea-input:focus { border-color: #1890ff; }

  /* ---------- 数字+单位 行 ---------- */
  .num-row { display: flex; align-items: center; gap: 0; }
  .num-input {
    width: 120px;
    height: 32px;
    border: 1px solid #d9d9d9;
    border-radius: 2px;
    padding: 0 12px;
    font-size: 14px;
    outline: none;
    border-right: none;
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
    transition: border-color .2s;
  }
  .num-input:focus { border-color: #1890ff; }
  .num-unit {
    height: 32px;
    line-height: 32px;
    padding: 0 12px;
    border: 1px solid #d9d9d9;
    border-radius: 2px;
    border-top-left-radius: 0;
    border-bottom-left-radius: 0;
    background: #fafafa;
    font-size: 14px;
    color: #262626;
    white-space: nowrap;
  }

  /* ---------- 复选框组 ---------- */
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 32px;
    line-height: 32px;
  }
  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  .checkbox-item input[type="checkbox"] {
    width: 14px; height: 14px;
    accent-color: #1890ff;
    cursor: pointer;
  }
  .help-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1px solid #bfbfbf;
    font-size: 11px;
    color: #8c8c8c;
    cursor: help;
    margin-left: 4px;
  }

  /* ---------- 多选下拉选择器 ---------- */
  .multi-select { position: relative; width: 360px; }
  .select-trigger {
    height: 32px;
    border: 1px solid #d9d9d9;
    border-radius: 2px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    font-size: 14px;
    cursor: pointer;
    transition: border-color .2s;
    user-select: none;
  }
  .select-trigger:hover { border-color: #40a9ff; }
  .multi-select.open .select-trigger {
    border-color: #1890ff;
    box-shadow: 0 0 0 2px rgba(24,144,255,.1);
  }
  .select-value { color: #262626; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .select-value.placeholder { color: #bfbfbf; }
  .select-arrow {
    width: 0; height: 0;
    margin-left: 8px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 5px solid #bfbfbf;
    transition: transform .2s;
    flex: 0 0 auto;
  }
  .multi-select.open .select-arrow { transform: rotate(180deg); border-top-color: #1890ff; }

  .select-panel {
    position: absolute;
    top: calc(100% + 2px);
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid #e8e8e8;
    border-radius: 2px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    padding: 4px 0;
    max-height: 280px;
    overflow-y: auto;
    display: none;
    z-index: 100;
  }
  .multi-select.open .select-panel { display: block; }

  .select-option {
    height: 32px;
    line-height: 32px;
    padding: 0 12px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    color: #262626;
    transition: background .15s;
  }
  .select-option:hover { background: #f5f5f5; }
  .select-option.selected { background: #e6f7ff; color: #1890ff; }

  .select-option .check-box {
    width: 14px; height: 14px;
    border: 1.5px solid #d9d9d9;
    border-radius: 2px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    margin-right: 8px;
    transition: all .15s;
  }
  .select-option.selected .check-box {
    background: #1890ff;
    border-color: #1890ff;
  }
  .select-option .check-box::after {
    content: '';
    width: 3px; height: 7px;
    border: solid #fff;
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg) translate(-0.5px, -0.5px);
    opacity: 0;
    transition: opacity .15s;
  }
  .select-option.selected .check-box::after { opacity: 1; }
  .select-option .opt-label { flex: 1; }

  /* "其他"选中时内联输入框 */
  .select-option.other-with-input {
    flex-wrap: nowrap;
    padding-right: 12px;
  }
  .panel-other-input {
    flex: 1;
    min-width: 0;
    height: 32px;
    border: 1px solid #40a9ff;
    border-radius: 4px;
    padding: 0 12px;
    font-size: 14px;
    outline: none;
    margin-left: 12px;
    background: #fff;
    color: #262626;
    transition: border-color .2s, box-shadow .2s;
    box-shadow: 0 0 0 2px rgba(24,144,255,.1);
  }
  .panel-other-input::placeholder { color: #bfbfbf; }
  .panel-other-input:focus {
    border-color: #1890ff;
    box-shadow: 0 0 0 3px rgba(24,144,255,.15);
  }
  .panel-other-input.error { border-color: #ff4d4f; box-shadow: 0 0 0 2px rgba(255,77,79,.1); }

  /* ---------- 选中标签 ---------- */
  .tag-container {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
    min-height: 24px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    height: 24px;
    padding: 0 6px 0 8px;
    background: #e6f7ff;
    border: 1px solid #91d5ff;
    border-radius: 2px;
    font-size: 12px;
    color: #1890ff;
    gap: 4px;
  }
  .tag-close {
    width: 14px; height: 14px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 10px;
    color: #1890ff;
    transition: background .15s;
    line-height: 1;
  }
  .tag-close:hover { background: rgba(24,144,255,.15); }

  /* ---------- "其他" 输入框 ---------- */
  .other-box { margin-top: 8px; display: none; }
  .other-box.show { display: block; }
  .other-input {
    width: 100%;
    height: 32px;
    border: 1px solid #d9d9d9;
    border-radius: 2px;
    padding: 0 12px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .other-input:focus { border-color: #1890ff; }
  .other-input.error { border-color: #ff4d4f; }

  .err-msg {
    display: none;
    color: #ff4d4f;
    font-size: 12px;
    margin-top: 4px;
  }
  .err-msg.show { display: block; }

  /* ---------- 底部按钮 ---------- */
  .footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    border-top: 1px solid #e8e8e8;
    padding: 12px 32px;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    z-index: 50;
  }
  .btn {
    height: 32px;
    padding: 0 20px;
    border-radius: 2px;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid #d9d9d9;
    background: #fff;
    color: #262626;
    transition: all .2s;
  }
  .btn:hover { border-color: #1890ff; color: #1890ff; }
  .btn-primary {
    background: #1890ff;
    color: #fff;
    border-color: #1890ff;
  }
  .btn-primary:hover { background: #40a9ff; border-color: #40a9ff; color: #fff; }

  /* ---------- 置顶按钮 ---------- */
  .back-top {
    position: fixed;
    right: 24px;
    bottom: 80px;
    width: 40px; height: 40px;
    background: #fff;
    border: 1px solid #e8e8e8;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 12px;
    color: #262626;
    z-index: 50;
  }
  .back-top .arrow {
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 8px solid #262626;
    margin-bottom: 2px;
  }

  /* ---------- 提交结果 ---------- */
  .submit-result {
    text-align: center;
    padding: 12px;
    font-size: 14px;
    color: #52c41a;
    display: none;
  }
  .submit-result.show { display: block; }
</style>
</head>
<body>

<div class="form-wrap">
  <!-- 日笔数 -->
  <div class="form-row">
    <div class="form-label">日笔数</div>
    <div class="form-ctrl">
      <div class="num-row">
        <input class="num-input" type="text" placeholder="请输入数字" />
        <span class="num-unit">万笔</span>
      </div>
    </div>
  </div>

  <!-- 完成预估规模时间 -->
  <div class="form-row">
    <div class="form-label"><span class="req">*</span>完成预估规模时间</div>
    <div class="form-ctrl">
      <input class="text-input" type="text" placeholder="请输入预估时间" />
    </div>
  </div>

  <!-- 展业模式 -->
  <div class="form-row">
    <div class="form-label"><span class="req">*</span>展业模式</div>
    <div class="form-ctrl">
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" /> 直营</label>
        <label class="checkbox-item"><input type="checkbox" /> 渠道代理</label>
      </div>
    </div>
  </div>

  <!-- 当前渠道（多选改造） -->
  <div class="form-row">
    <div class="form-label"><span class="req">*</span>当前渠道</div>
    <div class="form-ctrl">
      <div class="multi-select" id="channelSelect">
        <div class="select-trigger" id="channelTrigger" tabindex="0">
          <span class="select-value placeholder" id="channelValue">请选择</span>
          <i class="select-arrow"></i>
        </div>
        <div class="select-panel" id="channelPanel"></div>
      </div>
      <div class="tag-container" id="tagContainer"></div>
      <div class="other-box" id="otherBox">
        <input class="other-input" id="otherInput" type="text" placeholder="请输入当前渠道名称" maxlength="50" />
      </div>
      <div class="err-msg" id="errMsg">请选择当前渠道</div>
    </div>
  </div>

  <!-- 业务场景模式 -->
  <div class="form-row">
    <div class="form-label"><span class="req">*</span>业务场景模式</div>
    <div class="form-ctrl">
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" /> 线下</label>
        <label class="checkbox-item"><input type="checkbox" /> 线上</label>
        <span class="help-icon" title="线上模式说明">ⓘ</span>
      </div>
    </div>
  </div>

  <!-- 公司网址 / 产品下载链接 -->
  <div class="form-row">
    <div class="form-label">公司网址</div>
    <div class="form-ctrl" style="display:flex;gap:32px;flex-wrap:wrap;">
      <input class="text-input" type="text" placeholder="请输入公司网址" style="width:340px;" />
      <div>
        <div style="font-size:14px;line-height:32px;">产品下载链接或名称</div>
        <input class="text-input" type="text" placeholder="请输入产品下载链接或名称" style="width:340px;" />
      </div>
    </div>
  </div>

  <!-- 产品及业务介绍 -->
  <div class="form-row">
    <div class="form-label"><span class="req">*</span>产品及业务介绍</div>
    <div class="form-ctrl">
      <textarea class="textarea-input" placeholder="请输入产品及业务介绍"></textarea>
    </div>
  </div>
</div>

<!-- 提交结果 -->
<div class="submit-result" id="submitResult"></div>

<!-- 底部按钮 -->
<div class="footer">
  <button class="btn" type="button">保 存</button>
  <button class="btn btn-primary" type="button" id="btnSubmit">提交申请</button>
</div>

<!-- 置顶按钮 -->
<div class="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <div class="arrow"></div>
  <span>置顶</span>
</div>

<script>
(function () {
  var CHANNELS = [
    "乐刷", "富友", "好哒", "拉卡拉", "易宝",
    "汇付", "国通", "汇来米", "收钱吧", "其他"
  ];

  var select = document.getElementById("channelSelect");
  var trigger = document.getElementById("channelTrigger");
  var panel = document.getElementById("channelPanel");
  var valueEl = document.getElementById("channelValue");
  var tagContainer = document.getElementById("tagContainer");
  var otherBox = document.getElementById("otherBox");
  var otherInput = document.getElementById("otherInput");
  var errMsg = document.getElementById("errMsg");
  var submitResult = document.getElementById("submitResult");

  var selected = [];
  var otherText = "";

  // 渲染下拉面板（"其他"选中时右侧出现填写输入框）
  function renderPanel() {
    panel.innerHTML = "";
    var isOtherSel = selected.indexOf("其他") !== -1;
    CHANNELS.forEach(function (opt) {
      var div = document.createElement("div");
      var isSel = selected.indexOf(opt) !== -1;
      if (opt === "其他" && isOtherSel) {
        // "其他"选中时：选项行内右侧嵌入输入框
        div.className = "select-option selected other-with-input";
        div.innerHTML =
          "<span class='check-box'></span>" +
          "<span class='opt-label'>其他</span>" +
          "<input class='panel-other-input' type='text' placeholder='请输入渠道名称' maxlength='50' />";
        var inp = div.querySelector(".panel-other-input");
        inp.value = otherText;
        // 阻止点击时取消选中（输入框点击不触发 toggle）
        inp.addEventListener("mousedown", function (e) { e.stopPropagation(); });
        inp.addEventListener("click", function (e) { e.stopPropagation(); });
        inp.addEventListener("input", function () {
          otherText = inp.value;
          this.classList.remove("error");
          errMsg.classList.remove("show");
          updateDisplay();
        });
        div.addEventListener("mousedown", function (e) {
          // 只有点 checkbox 或 label 区域才 toggle，输入框不触发
          if (e.target === inp) return;
          e.preventDefault();
          toggle(opt);
        });
        panel.appendChild(div);
        // 自动聚焦
        setTimeout(function() { inp.focus(); }, 30);
      } else {
        div.className = "select-option" + (isSel ? " selected" : "");
        div.innerHTML = "<span class='check-box'></span><span class='opt-label'>" + opt + "</span>";
        div.addEventListener("mousedown", function (e) {
          e.preventDefault();
          e.stopPropagation();
          toggle(opt);
        });
        panel.appendChild(div);
      }
    });
  }

  // 切换选中
  function toggle(opt) {
    var idx = selected.indexOf(opt);
    if (idx !== -1) {
      selected.splice(idx, 1);
    } else {
      selected.push(opt);
    }
    if (opt === "其他" && idx === -1) {
      // 选中"其他"：不关闭面板，让输入框出现
      otherInput.value = otherText;
    } else if (opt === "其他" && idx !== -1) {
      otherText = "";
      otherInput.value = "";
      otherInput.classList.remove("error");
    }
    updateDisplay();
    renderPanel();
    errMsg.classList.remove("show");
  }

  // 移除标签
  function removeTag(opt) {
    var idx = selected.indexOf(opt);
    if (idx !== -1) selected.splice(idx, 1);
    if (opt === "其他") {
      otherText = "";
      otherInput.value = "";
      otherInput.classList.remove("error");
    }
    updateDisplay();
    renderPanel();
  }

  // 更新显示
  function updateDisplay() {
    if (selected.length === 0) {
      valueEl.textContent = "请选择";
      valueEl.classList.add("placeholder");
    } else {
      valueEl.textContent = "已选择 " + selected.length + " 项";
      valueEl.classList.remove("placeholder");
    }
    tagContainer.innerHTML = "";
    selected.forEach(function (opt) {
      var tag = document.createElement("span");
      tag.className = "tag";
      var label = (opt === "其他" && otherText.trim()) ? otherText.trim() : opt;
      tag.innerHTML = "<span>" + label + "</span><span class='tag-close' title='移除'>×</span>";
      tag.querySelector(".tag-close").addEventListener("click", function (e) {
        e.stopPropagation();
        removeTag(opt);
      });
      tagContainer.appendChild(tag);
    });
  }

  // 展开/收起
  function openPanel() { select.classList.add("open"); renderPanel(); }
  function closePanel() { select.classList.remove("open"); }

  trigger.addEventListener("click", function (e) {
    e.stopPropagation();
    select.classList.contains("open") ? closePanel() : openPanel();
  });

  document.addEventListener("click", function (e) {
    if (!select.contains(e.target)) closePanel();
  });

  // 下方备用输入框的同步（隐藏状态但保留引用）
  otherInput.addEventListener("input", function () {
    otherInput.classList.remove("error");
    errMsg.classList.remove("show");
    otherText = otherInput.value;
    updateDisplay();
    renderPanel();
  });

  // 提交
  document.getElementById("btnSubmit").addEventListener("click", function () {
    submitResult.classList.remove("show");
    if (selected.length === 0) {
      errMsg.textContent = "请选择当前渠道";
      errMsg.classList.add("show");
      trigger.focus();
      return;
    }
    if (selected.indexOf("其他") !== -1 && !otherText.trim()) {
      errMsg.textContent = "请输入其他渠道名称";
      errMsg.classList.add("show");
      openPanel();
      return;
    }
    var finalVals = selected.map(function (opt) {
      return opt === "其他" ? otherText.trim() : opt;
    });
    submitResult.textContent = "提交成功！当前渠道：" + finalVals.join("、");
    submitResult.classList.add("show");
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  renderPanel();
})();
</script>
</body>
</html>
