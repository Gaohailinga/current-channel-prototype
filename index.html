<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>当前渠道选择页 - 评审版</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="phone-frame">
    <nav class="navbar">
      <div class="nav-back" id="nav-back">‹</div>
      <div class="nav-title">当前渠道</div>
      <div class="nav-done" id="btn-done">完成</div>
    </nav>
    <div class="content">
      <div class="option-list" id="option-list"></div>
      <div class="other-input" id="other-input">
        <input type="text" id="other-text" placeholder="请输入当前渠道名称" />
      </div>
    </div>

    <div class="annot-layer">
      <div class="annot annot-left" data-annot-id="nav" style="left: 480px; top: 40px;">
        <span class="annot-label">顶部导航</span><br>
        绿色导航栏，左侧返回，右侧<strong class="annot-key">完成</strong>提交选择
      </div>

      <div class="annot annot-left" data-annot-id="list" style="left: 480px; top: 160px;">
        <span class="annot-label">枚举平铺</span><br>
        11 个渠道整行可点击，无需单选按钮
      </div>

      <div class="annot annot-left" data-annot-id="check" style="left: 480px; top: 320px;">
        <span class="annot-label">选中态</span><br>
        选中项右侧显示绿色<strong class="annot-key">✓</strong>对勾
      </div>

      <div class="annot annot-left" data-annot-id="other" style="left: 480px; top: 560px;">
        <span class="annot-label">其他可编辑</span><br>
        选择「其他」后自动展开输入框，必填
      </div>

      <div class="annot-dim" data-annot-id="rule" style="left: 480px; top: 720px;">
        校验规则：未选择时提示「请选择当前渠道」；选其他未填时提示「请输入当前渠道名称」
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/app.js"></script>
  <script src="js/annot-drag.js"></script>
</body>
</html>
